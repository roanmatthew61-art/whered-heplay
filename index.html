// Quote-aware CSV line splitter — handles fields containing commas or escaped
// quotes, which Google Sheets produces automatically when a cell needs it.
function parseCSVLine(line) {
  const result = [];
  let cur = "";
  let inQuotes = false;
  for (let i = 0; i < line.length; i++) {
    const char = line[i];
    if (inQuotes) {
      if (char === '"') {
        if (line[i + 1] === '"') { cur += '"'; i++; }
        else { inQuotes = false; }
      } else {
        cur += char;
      }
    } else if (char === '"') {
      inQuotes = true;
    } else if (char === ",") {
      result.push(cur);
      cur = "";
    } else {
      cur += char;
    }
  }
  result.push(cur);
  return result;
}

function parseCSV(text) {
  const lines = text.trim().split("\n").map(l => l.replace(/\r$/, ""));
  const header = parseCSVLine(lines[0]).map(h => h.trim());
  return lines.slice(1)
    .filter(line => line.trim().length > 0)
    .map(line => {
      const cols = parseCSVLine(line);
      const row = {};
      header.forEach((h, i) => row[h] = (cols[i] || "").trim());
      return row;
    });
}

function buildPlayers(csvText) {
  return parseCSV(csvText)
    .map(row => ({
      name: row.player_name,
      position: row.position,
      teamStatus: row.team_status,
      college: row.college,
      conference: row.conference,
      coach: row.coach,
      difficulty: row.difficulty,
      logo: logoUrlFor(row.team_status || "")
    }))
    .filter(p => p.name && p.college && p.teamStatus);
}

function collegesFromPlayers(list) {
  return [...new Set(list.map(p => p.college).filter(Boolean))].sort((a, b) => a.localeCompare(b));
}

// changes at midnight wherever the player is.
const EPOCH_DATE = new Date(2026, 6, 21);

function getPuzzleNumber(date = new Date()) {
  const start = new Date(EPOCH_DATE.getFullYear(), EPOCH_DATE.getMonth(), EPOCH_DATE.getDate());
  const today = new Date(date.getFullYear(), date.getMonth(), date.getDate());
  const diffDays = Math.round((today - start) / 86400000);
  return diffDays + 1;
}

// Seeded PRNG (mulberry32) so the same puzzle number always produces the same
// shuffle — that's what makes the daily puzzle identical for every player.
function mulberry32(seed) {
  return function () {
    seed |= 0;
    seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// ---- Difficulty mix ----
// Most days run 2 easy / 2 medium / 1 hard; occasionally a day leans easier-skewed-medium
// or splits toward the extremes instead. Weights pick which pattern a given day uses.
const DIFFICULTY_PATTERNS = [
  { easy: 2, medium: 2, hard: 1, weight: 0.6 },
  { easy: 1, medium: 3, hard: 1, weight: 0.2 },
  { easy: 2, medium: 1, hard: 2, weight: 0.2 },
];

function patternForDay(puzzleNum) {
  const rng = mulberry32(puzzleNum * 999983 + 1); // distinct seed stream from player shuffling below
  const r = rng();
  let cumulative = 0;
  for (const pattern of DIFFICULTY_PATTERNS) {
    cumulative += pattern.weight;
    if (r < cumulative) return pattern;
  }
  return DIFFICULTY_PATTERNS[DIFFICULTY_PATTERNS.length - 1];
}

function playersByDifficulty(pool) {
  const groups = { easy: [], medium: [], hard: [] };
  pool.forEach(p => {
    const tier = (p.difficulty || "").trim().toLowerCase();
    if (groups[tier]) groups[tier].push(p);
  });
  return groups;
}

function hashSeed(tierName) {
  let h = 0;
  for (let i = 0; i < tierName.length; i++) h = (h * 31 + tierName.charCodeAt(i)) | 0;
  return h >>> 0;
}

// One fixed shuffle order per tier, repeating on a strict cycle — the player at
// position k reappears at k+size, k+2*size, and so on, always exactly `size`
// picks apart. A fixed order (rather than reshuffling each pass) is what
// guarantees that gap precisely; independently-reshuffled passes can
// coincidentally place a just-used player right after the boundary, which
// defeats the point.
function tierOrder(tierPool, tierName) {
  const rng = mulberry32(hashSeed(tierName));
  const arr = [...tierPool];
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(rng() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function playerAtPosition(tierPool, tierName, absolutePosition) {
  const size = tierPool.length;
  if (size === 0) return null;
  return tierOrder(tierPool, tierName)[absolutePosition % size];
}

function drawFromTier(tierPool, tierName, startIndex, count, alreadyPicked) {
  const picks = [];
  let pos = startIndex;
  let guard = 0;
  while (picks.length < count && guard < count + tierPool.length + 5) {
    const candidate = playerAtPosition(tierPool, tierName, pos);
    if (candidate && !alreadyPicked.has(candidate.name)) {
      picks.push(candidate);
      alreadyPicked.add(candidate.name);
    }
    pos++;
    guard++;
  }
  return picks;
}

// How many tier-T players every day before puzzleNum has already drawn — this is
// what makes each day continue where the previous one left off in that tier's cycle.
function cumulativeBefore(puzzleNum, tierName) {
  let total = 0;
  for (let d = 1; d < puzzleNum; d++) total += patternForDay(d)[tierName];
  return total;
}

function dailyPool(puzzleNum) {
  const groups = playersByDifficulty(rawPlayers);
  const pattern = patternForDay(puzzleNum);
  const alreadyPicked = new Set();
  const picks = [];

  ["easy", "medium", "hard"].forEach(tier => {
    const tierPool = groups[tier];
    const count = Math.min(pattern[tier], tierPool.length);
    if (count === 0) return;
    const startIndex = cumulativeBefore(puzzleNum, tier);
    picks.push(...drawFromTier(tierPool, tier, startIndex, count, alreadyPicked));
  });

  // Safety net: if a tier came up short (e.g. the sheet temporarily has too few
  // hard players), top up from the rest of the pool so today still has 5 players.
  if (picks.length < ROUNDS_PER_GAME) {
    const rng = mulberry32(puzzleNum * 7919 + 3);
    const remaining = rawPlayers.filter(p => !alreadyPicked.has(p.name));
    for (let i = remaining.length - 1; i > 0; i--) {
      const j = Math.floor(rng() * (i + 1));
      [remaining[i], remaining[j]] = [remaining[j], remaining[i]];
    }
    for (const p of remaining) {
      if (picks.length >= ROUNDS_PER_GAME) break;
      picks.push(p);
      alreadyPicked.add(p.name);
    }
  }

  // Shuffle the order the day's 5 players appear in, so rounds aren't always
  // presented easy-to-hard.
  const orderRng = mulberry32(puzzleNum * 40503 + 7);
  for (let i = picks.length - 1; i > 0; i--) {
    const j = Math.floor(orderRng() * (i + 1));
    [picks[i], picks[j]] = [picks[j], picks[i]];
  }

  return picks;
}

// ---- Game state ----
let puzzleNumber = getPuzzleNumber();
let players = [];       // the 5 players chosen for today's puzzle
let roundIndex = 0;
let strikes = 0;
let results = [];       // { correct: bool, strikesUsed: number }
let activeSuggestions = [];
let highlightedIndex = -1;

const logoEl = document.getElementById("logo");
const nameEl = document.getElementById("playerName");
const roundCounterEl = document.getElementById("roundCounter");
const strikesEl = document.getElementById("strikes");
const hintsEl = document.getElementById("hints");
const formEl = document.getElementById("guessForm");
const inputEl = document.getElementById("collegeInput");
const suggestionsEl = document.getElementById("suggestions");
const guessBtn = document.getElementById("guessBtn");
const feedbackEl = document.getElementById("feedback");
const gameEl = document.getElementById("game");
const summaryEl = document.getElementById("summary");
const puzzleLabelEl = document.getElementById("puzzleLabel");
const statsViewEl = document.getElementById("statsView");
const statsNavBtn = document.getElementById("statsNavBtn");
const loadingViewEl = document.getElementById("loadingView");
const helpBtn = document.getElementById("helpBtn");
const helpPanel = document.getElementById("helpPanel");

helpBtn.addEventListener("click", () => helpPanel.classList.toggle("hidden"));

// ---- Autocomplete ----
function renderSuggestions(query) {
  const q = query.trim().toLowerCase();
  if (!q) {
    hideSuggestions();
    return;
  }
  const starts = colleges.filter(c => c.toLowerCase().startsWith(q));
  const contains = colleges.filter(c => !c.toLowerCase().startsWith(q) && c.toLowerCase().includes(q));
  activeSuggestions = [...starts, ...contains].slice(0, MAX_SUGGESTIONS);
  highlightedIndex = -1;

  if (activeSuggestions.length === 0) {
    hideSuggestions();
    return;
  }

  suggestionsEl.innerHTML = activeSuggestions
    .map((c, i) => `<div data-index="${i}">${c}</div>`)
    .join("");
  suggestionsEl.classList.remove("hidden");
}

function hideSuggestions() {
  suggestionsEl.classList.add("hidden");
  suggestionsEl.innerHTML = "";
  activeSuggestions = [];
  highlightedIndex = -1;
}

function selectSuggestion(index) {
  const choice = activeSuggestions[index];
  if (!choice) return;
  inputEl.value = choice;
  hideSuggestions();
  inputEl.focus();
}

function updateHighlight() {
  [...suggestionsEl.children].forEach((el, i) => {
    el.classList.toggle("active", i === highlightedIndex);
  });
}

inputEl.addEventListener("input", () => renderSuggestions(inputEl.value));

inputEl.addEventListener("keydown", (e) => {
  if (suggestionsEl.classList.contains("hidden")) return;

  if (e.key === "ArrowDown") {
    e.preventDefault();
    highlightedIndex = Math.min(highlightedIndex + 1, activeSuggestions.length - 1);
    updateHighlight();
  } else if (e.key === "ArrowUp") {
    e.preventDefault();
    highlightedIndex = Math.max(highlightedIndex - 1, 0);
    updateHighlight();
  } else if (e.key === "Enter" && highlightedIndex >= 0) {
    e.preventDefault();
    selectSuggestion(highlightedIndex);
  } else if (e.key === "Escape") {
    hideSuggestions();
  }
});

suggestionsEl.addEventListener("mousedown", (e) => {
  const target = e.target.closest("[data-index]");
  if (!target) return;
  e.preventDefault();
  selectSuggestion(Number(target.dataset.index));
});

document.addEventListener("click", (e) => {
  if (!e.target.closest("#autocompleteWrap")) hideSuggestions();
});

// ---- Game flow ----
function startGame() {
  puzzleNumber = getPuzzleNumber();
  puzzleLabelEl.textContent = `#${puzzleNumber}`;
  players = dailyPool(puzzleNumber);
  roundIndex = 0;
  results = [];
  summaryEl.classList.add("hidden");
  gameEl.classList.remove("hidden");
  loadRound();
}

function loadRound() {
  strikes = 0;
  feedbackEl.textContent = "";
  feedbackEl.className = "";
  hintsEl.innerHTML = "";
  inputEl.value = "";
  inputEl.disabled = false;
  guessBtn.disabled = false;
  hideSuggestions();

  const p = players[roundIndex];

  logoEl.src = p.logo;
  logoEl.alt = (p.teamStatus === "Retired" || p.teamStatus === "Free Agent")
    ? "NFL shield"
    : p.teamStatus + " logo";

  nameEl.textContent = p.name;
  roundCounterEl.textContent = `Player ${roundIndex + 1} of ${players.length}`;
  updateStrikesDisplay();
  inputEl.focus();
}

function updateStrikesDisplay() {
  let html = "";
  for (let i = 0; i < 3; i++) {
    html += `<span class="strike-box${i < strikes ? " used" : ""}"></span>`;
  }
  strikesEl.innerHTML = html;
}

function handleGuess(e) {
  e.preventDefault();

  const typed = inputEl.value.trim();
  const canonical = colleges.find(c => c.toLowerCase() === typed.toLowerCase());

  if (!canonical) {
    feedbackEl.textContent = "Please choose a valid college from the list.";
    feedbackEl.className = "wrong";
    return;
  }

  hideSuggestions();
  const p = players[roundIndex];

  if (canonical === p.college) {
    feedbackEl.textContent = `Correct! ${p.name} played at ${p.college}.`;
    feedbackEl.className = "correct";
    inputEl.disabled = true;
    guessBtn.disabled = true;
    results.push({ correct: true, strikesUsed: strikes });
    setTimeout(nextRound, 1400);
    return;
  }

  // wrong guess
  strikes++;
  updateStrikesDisplay();
  inputEl.value = "";

  if (strikes === 1) {
    feedbackEl.textContent = "Not quite. Strike 1.";
    feedbackEl.className = "wrong";
    const hint = document.createElement("div");
    hint.className = "hint";
    hint.textContent = `Hint: Conference — ${p.conference}`;
    hintsEl.appendChild(hint);
  } else if (strikes === 2) {
    feedbackEl.textContent = "Still not it. Strike 2.";
    feedbackEl.className = "wrong";
    const hint = document.createElement("div");
    hint.className = "hint";
    hint.textContent = `Hint: Head coach — ${p.coach}`;
    hintsEl.appendChild(hint);
  } else if (strikes >= 3) {
    feedbackEl.textContent = `Out of strikes. The answer was ${p.college}.`;
    feedbackEl.className = "wrong";
    inputEl.disabled = true;
    guessBtn.disabled = true;
    results.push({ correct: false, strikesUsed: strikes });
    setTimeout(nextRound, 1800);
  }
}

function nextRound() {
  roundIndex++;
  if (roundIndex >= players.length) {
    showSummary();
  } else {
    loadRound();
  }
}

// Weighted scoring: 3 pts if correct on the 1st guess, 2 on the 2nd, 1 on the 3rd, 0 if missed.
function pointsFor(r) {
  return r.correct ? 3 - r.strikesUsed : 0;
}

// One Wordle-style row per player: 🟥 for each wrong guess, 🟩 for the correct one,
// ⬛ for guesses never used (either solved early or missed entirely, so all 3 are red).
function emojiRowFor(r) {
  const attemptsMade = r.correct ? r.strikesUsed + 1 : 3;
  let row = "";
  for (let i = 0; i < attemptsMade; i++) {
    const isLast = i === attemptsMade - 1;
    row += (r.correct && isLast) ? "🟩" : "🟥";
  }
  for (let i = attemptsMade; i < 3; i++) row += "⬛";
  return row;
}

function buildShareText(totalPoints, maxPoints, streak) {
  const grid = results.map(emojiRowFor).join("\n");
  return `Where'd He Play? #${puzzleNumber} ${totalPoints}/${maxPoints}\n🔥 ${streak}-day streak\n\n${grid}`;
}

function copyResults() {
  const textarea = document.getElementById("shareText");
  const status = document.getElementById("copyStatus");
  textarea.focus();
  textarea.select();

  navigator.clipboard.writeText(textarea.value).then(() => {
    status.textContent = "Copied to clipboard!";
  }).catch(() => {
    const worked = document.execCommand("copy");
    status.textContent = worked
      ? "Copied to clipboard!"
      : "Couldn't auto-copy — text is selected, press Cmd/Ctrl+C.";
  });
}

// ---- Streaks & stats (persisted in localStorage) ----
const STATS_KEY = "wheredHePlayStats";

function loadStats() {
  const blank = { lastPuzzleNumber: null, currentStreak: 0, maxStreak: 0, gamesPlayed: 0, totalPoints: 0, history: [] };
  try {
    const raw = localStorage.getItem(STATS_KEY);
    return raw ? JSON.parse(raw) : blank;
  } catch (e) {
    return blank;
  }
}

function saveStats(stats) {
  try {
    localStorage.setItem(STATS_KEY, JSON.stringify(stats));
  } catch (e) {
    // localStorage unavailable (private browsing, etc.) — stats just won't persist this session.
  }
}

// Replaying the same puzzle number never double-counts, since a puzzle is only
// recorded into history once. "Streak" here means played every day, not scored —
// missing a day (a gap in puzzle numbers) resets it back to 1.
function recordCompletion(totalPoints, maxPoints) {
  const stats = loadStats();
  if (stats.history.some(h => h.puzzle === puzzleNumber)) return stats;

  stats.currentStreak = (stats.lastPuzzleNumber === puzzleNumber - 1) ? stats.currentStreak + 1 : 1;
  stats.maxStreak = Math.max(stats.maxStreak, stats.currentStreak);
  stats.gamesPlayed += 1;
  stats.totalPoints += totalPoints;
  stats.lastPuzzleNumber = puzzleNumber;
  stats.history.push({ puzzle: puzzleNumber, points: totalPoints, maxPoints });
  if (stats.history.length > 30) stats.history = stats.history.slice(-30);

  saveStats(stats);
  return stats;
}

function renderStatsView() {
  const stats = loadStats();
  const avg = stats.gamesPlayed > 0 ? (stats.totalPoints / stats.gamesPlayed).toFixed(1) : "0.0";

  let body;
  if (stats.gamesPlayed === 0) {
    body = `<p class="emptyStats">Play your first puzzle to start tracking stats.</p>`;
  } else {
    const recent = stats.history.slice(-14);
    const bars = recent.map(h => {
      const pct = Math.max(4, Math.round((h.points / h.maxPoints) * 100));
      const cls = h.points === h.maxPoints ? "chartBar perfect" : "chartBar";
      return `<div class="${cls}" style="height:${pct}%" title="Puzzle #${h.puzzle}: ${h.points}/${h.maxPoints}"></div>`;
    }).join("");
    const labels = recent.map(h => `<span>#${h.puzzle}</span>`).join("");

    body = `
      <div class="statsGrid">
        <div class="statCard"><div class="num">${stats.gamesPlayed}</div><div class="label">Played</div></div>
        <div class="statCard"><div class="num">${stats.currentStreak}</div><div class="label">Current streak</div></div>
        <div class="statCard"><div class="num">${stats.maxStreak}</div><div class="label">Max streak</div></div>
        <div class="statCard"><div class="num">${avg}</div><div class="label">Avg score (of 15)</div></div>
      </div>
      <div class="chartWrap">
        <div class="chartBars">${bars}</div>
        <div class="chartLabels">${labels}</div>
      </div>
    `;
  }

  statsViewEl.innerHTML = `
    <h2>Your stats</h2>
    ${body}
    <button id="statsBackBtn" type="button" class="btn-secondary">Back</button>
  `;
  document.getElementById("statsBackBtn").addEventListener("click", closeStats);
}

let preStatsPanel = "game";

function openStats() {
  preStatsPanel = summaryEl.classList.contains("hidden") ? "game" : "summary";
  gameEl.classList.add("hidden");
  summaryEl.classList.add("hidden");
  renderStatsView();
  statsViewEl.classList.remove("hidden");
}

function closeStats() {
  statsViewEl.classList.add("hidden");
  if (preStatsPanel === "summary") {
    summaryEl.classList.remove("hidden");
  } else {
    gameEl.classList.remove("hidden");
  }
}

statsNavBtn.addEventListener("click", openStats);

function showSummary() {
  gameEl.classList.add("hidden");
  summaryEl.classList.remove("hidden");

  const maxPoints = players.length * 3;
  const totalPoints = results.reduce((sum, r) => sum + pointsFor(r), 0);
  const stats = recordCompletion(totalPoints, maxPoints);

  let rows = "";
  players.forEach((p, i) => {
    const r = results[i];
    rows += `<tr>
      <td>${p.name}</td>
      <td>${r.correct ? "✅" : "❌"}</td>
      <td>${pointsFor(r)} pt${pointsFor(r) === 1 ? "" : "s"}</td>
    </tr>`;
  });

  summaryEl.innerHTML = `
    <h2>Score: ${totalPoints} / ${maxPoints}</h2>
    <p id="streakLine">🔥 ${stats.currentStreak}-day streak</p>
    <table>
      <tr><th>Player</th><th>Result</th><th>Points</th></tr>
      ${rows}
    </table>
    <div id="shareSection">
      <textarea id="shareText" readonly rows="${players.length + 3}"></textarea>
      <div id="shareActions">
        <button id="copyBtn" type="button" class="btn-secondary">Copy results</button>
        <button id="shareBtn" type="button" class="hidden">Share</button>
      </div>
      <div id="copyStatus"></div>
    </div>
    <button id="restartBtn" class="btn-secondary">Replay puzzle #${puzzleNumber}</button>
  `;

  document.getElementById("shareText").value = buildShareText(totalPoints, maxPoints, stats.currentStreak);
  document.getElementById("copyBtn").addEventListener("click", copyResults);
  document.getElementById("restartBtn").addEventListener("click", startGame);

  const shareBtn = document.getElementById("shareBtn");
  if (navigator.share) {
    shareBtn.classList.remove("hidden");
    shareBtn.addEventListener("click", () => {
      navigator.share({ text: buildShareText(totalPoints, maxPoints, stats.currentStreak) }).catch(() => {});
    });
  }
}

formEl.addEventListener("submit", handleGuess);

async function fetchWithTimeout(url, ms) {
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), ms);
  try {
    return await fetch(url, { signal: controller.signal, cache: "no-store" });
  } finally {
    clearTimeout(timer);
  }
}

// Try the live sheet first; if it's unreachable, times out, or comes back
// malformed/too small, fall back to the roster built into the page.
async function boot() {
  try {
    const response = await fetchWithTimeout(SHEET_CSV_URL, 8000);
    if (!response.ok) throw new Error(`Sheet fetch failed: ${response.status}`);
    const text = await response.text();
    const parsed = buildPlayers(text);
    if (parsed.length < ROUNDS_PER_GAME) throw new Error("Sheet data missing or too small");
    rawPlayers = parsed;
  } catch (e) {
    rawPlayers = FALLBACK_PLAYERS;
    console.warn("Using built-in player data — couldn't load the live sheet:", e);
  }

  colleges = collegesFromPlayers(rawPlayers);
  loadingViewEl.classList.add("hidden");
  startGame();
}

boot();
</script>
